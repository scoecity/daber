<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C4233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daber">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}</style>
<title>Daber Hebrew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Sticky status bar, scrolling middle, bottom tab bar. Lessons open as a full-screen sheet. */
:root{
  --bg:#EEF3F7; --surface:#FFFFFF; --ink:#13223A; --muted:#5A6B82; --line:#D5DFEA; --soft:#E2EAF3;
  --accent:#C4233A; --accent-2:#A51C30; --on-accent:#FFFFFF;
  --sea:#0F7A88; --gold:#D99A00; --gold-soft:#FBF0D2;
  --good:#1D8A57; --good-bg:#DDF2E6; --bad:#C4233A; --bad-bg:#FBE4E8;
  --display:"Frank Ruhl Libre", "Times New Roman", serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#152238; --ink:#E7EEF7; --muted:#93A4BB; --line:#24344F; --soft:#1B2B45;
  --accent:#EE5168; --accent-2:#D63E56; --on-accent:#FFFFFF;
  --sea:#3BB4C2; --gold:#F2BE45; --gold-soft:#3A3016;
  --good:#4CC28A; --good-bg:#12321F; --bad:#EE5168; --bad-bg:#3A1620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#152238; --ink:#E7EEF7; --muted:#93A4BB; --line:#24344F; --soft:#1B2B45;
  --accent:#EE5168; --accent-2:#D63E56; --on-accent:#FFFFFF;
  --sea:#3BB4C2; --gold:#F2BE45; --gold-soft:#3A3016;
  --good:#4CC28A; --good-bg:#12321F; --bad:#EE5168; --bad-bg:#3A1620; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.he{font-family:var(--display);direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* status bar */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:6px;margin-inline-end:auto}
.brand .he{font-size:26px;font-weight:900;color:var(--accent);line-height:1}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip{display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.chip svg{width:20px;height:20px}
.ring{width:30px;height:30px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:16px 24px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;color:var(--muted);font-weight:500}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* level card */
.levelcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-bottom:18px}
.lvl{grid-row:span 2;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .5s}
.levelcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}

/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:30px;padding-block:18px 8px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.disc{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .12s}
.disc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.disc .he{font-size:34px;font-weight:700;line-height:1}
.disc.long .he{font-size:20px}
.node.done .disc{background:var(--sea);border-color:var(--sea);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--sea) 60%,#000)}
.node.next .disc{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-2);animation:bob 2.4s ease-in-out infinite}
.node.locked .disc{color:var(--muted);opacity:.6}
.node .lbl{font-size:13px;font-weight:600;text-align:center;line-height:1.25}
.node.locked .lbl{color:var(--muted);font-weight:500}
.crowns{display:flex;gap:4px;height:8px}
.crowns i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.crowns i.on{background:var(--gold)}
.startflag{position:absolute;top:-30px;background:var(--surface);color:var(--accent);font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;border:2px solid var(--accent);white-space:nowrap;font-family:var(--body);letter-spacing:.04em;text-transform:uppercase}
@keyframes bob{50%{transform:translateY(-4px)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-2);width:100%;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sea{background:var(--sea);box-shadow:0 4px 0 color-mix(in srgb,var(--sea) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

.practice-item{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:start;width:100%}
.practice-item .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--soft);font-family:var(--display);font-size:28px;font-weight:700}
.practice-item b{display:block;font-size:17px}
.practice-item span{font-size:14px;color:var(--muted)}

/* phrasebook */
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tog{padding:7px 12px;border-radius:999px;border:2px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--sea);color:var(--sea);background:color-mix(in srgb,var(--sea) 10%,transparent)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.group h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase .he{font-size:24px;font-weight:700;line-height:1.3;text-align:right;grid-column:1/-1}
.phrase .tr{font-style:italic;color:var(--sea);font-size:15px}
.phrase .en{font-size:15px}
.phrase .acts{grid-row:2/4;grid-column:2;display:flex;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{color:var(--gold)}

/* me */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:26px;background:var(--soft);color:var(--muted);border:3px dashed var(--line)}
.badge.got .medal{background:var(--gold-soft);color:var(--gold);border:3px solid var(--gold)}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted);line-height:1.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week .d{height:64px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.week .d i{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--gold);min-height:3px}
.week .d.zero i{background:var(--line)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.pick{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.pick button{padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

/* lesson sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;min-height:0}
.lbar{display:flex;align-items:center;gap:12px;padding-block:12px}
.lbar .bar{flex:1;height:14px}
.lbar .bar>i{background:var(--good)}
.combo{font-weight:700;color:var(--gold);font-size:14px;min-width:44px;text-align:end;font-variant-numeric:tabular-nums}
.qbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:8px 20px}
.qtitle{font-size:20px;font-weight:700}
.glyph{font-family:var(--display);font-weight:700;font-size:120px;line-height:1.1;text-align:center;direction:rtl}
.glyph.mid{font-size:44px;line-height:1.35}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.prompt .tr{color:var(--sea);font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.list{grid-template-columns:1fr}
.opt{padding:16px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:17px;min-height:60px;text-align:center}
.opt .he{font-size:30px;font-weight:700}
.opts.list .opt .he{font-size:24px}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt[disabled]{cursor:default}
.bigplay{width:96px;height:96px;border-radius:24px;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--sea) 60%,#000);margin:8px auto}
.bigplay svg{width:44px;height:44px}
.playrow{display:flex;gap:14px;justify-content:center}
.playrow .bigplay{margin:8px 0}
.tray{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;direction:rtl;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.tile{padding:8px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--display);font-size:24px;font-weight:700}
.tile.used{visibility:hidden}
.feedback{padding-block:14px;display:flex;flex-direction:column;gap:10px;border-top:2px solid transparent}
.feedback.good{background:var(--good-bg);border-color:var(--good)}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad)}
.feedback .msg{font-weight:700;font-size:18px}
.feedback.good .msg{color:var(--good)}
.feedback.bad .msg{color:var(--bad)}
.feedback .ans{font-size:15px}
.feedback .ans .he{font-size:22px;font-weight:700}
.feedback.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.learncard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.learncard .name{font-size:22px;font-weight:700}
.example{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 14px;width:100%;justify-content:space-between}
.example .he{font-size:30px;font-weight:700}
.tip{font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;text-align:start}
.done-hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:24px}
.done-hero .he{font-size:64px;font-weight:900;color:var(--accent);line-height:1}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.reward{border-radius:14px;border:2px solid var(--line);padding:10px 6px;text-align:center}
.reward b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.reward span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.reward.xp{border-color:var(--gold)}.reward.xp b{color:var(--gold)}
.reward.acc{border-color:var(--good)}.reward.acc b{color:var(--good)}
.reward.fire{border-color:var(--accent)}.reward.fire b{color:var(--accent)}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.x{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.x svg{width:24px;height:24px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.onb{gap:18px;padding-block:28px}
.onb .he.big{font-size:56px;font-weight:900;color:var(--accent);line-height:1}
.choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line)}
.choice .he{font-size:22px;font-weight:700}
.choice span{font-size:14px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--sea);box-shadow:0 4px 0 var(--sea)}
.node.test .disc{border-radius:24px;border-color:var(--gold);background:var(--gold-soft);box-shadow:0 5px 0 var(--gold)}
.node.test.done .disc,.node.test.next .disc{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.node.test.next .startflag{color:var(--gold);border-color:var(--gold)}
.node .score{font-size:12px;font-weight:700;color:var(--gold);line-height:8px}
.banner{display:flex;flex-direction:column;gap:10px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:16px}
.banner b{display:block;font-size:17px}.banner span{font-size:14px}.banner.daily span.he{font-size:inherit}
.practice-item .ic.sm{font-size:17px}
.snd{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--gold-soft);color:var(--ink);font-weight:700}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.mic{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-2)}
.mic svg{width:40px;height:40px}
.mic.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--accent) 22%,transparent)}}
.heard{min-height:48px}
.heard .he{font-size:24px;font-weight:700}
.stars{display:flex;gap:4px;justify-content:center;color:var(--line)}
.stars svg{width:30px;height:30px}.stars .on{color:var(--gold)}
.fc{width:100%;min-height:300px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.fc.flipped{border-color:var(--sea);box-shadow:0 6px 0 var(--sea)}
.fc .name{font-size:22px;font-weight:700}
.fc .tr{color:var(--sea);font-style:italic}
.missed{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start}
.missed div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:14px}
.missed .he{font-size:22px;font-weight:700}
.chat{gap:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;gap:3px}
.bub.her{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--sea) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--sea) 35%,transparent);border-bottom-right-radius:4px;text-align:end}
.bub.ask{text-align:start}
.bub .he{font-size:22px;font-weight:700;line-height:1.3}
.bub.now .he{font-size:28px}
.bub .tr{color:var(--sea);font-style:italic;font-size:14px}
.bub .en{font-size:15px}
.bstars{color:var(--gold);font-size:13px;letter-spacing:2px}
.linkbtn{color:var(--sea);font-weight:600;font-size:14px;text-align:start;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;font-family:var(--display)}
.wchip{padding:4px 10px;border-radius:10px;font-size:22px;font-weight:700}
.wchip.ok{background:var(--good-bg);color:var(--good)}
.wchip.miss{background:var(--soft);color:var(--muted);text-decoration:underline wavy var(--bad) 1px;text-underline-offset:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top wrap">
    <div class="brand"><span class="he" lang="he">דַּבֵּר</span><small>daber · speak</small></div>
    <div class="chip" id="streakChip" title="Day streak"></div>
    <div class="chip" id="goalChip" title="Daily goal"></div>
  </header>
  <main class="wrap" id="main"></main>

// Rebuild a saved state on top of fresh(), dropping any field with the wrong shape so a bad import can't break the app.
function sanitize(o){
  const f=fresh(), out={...f};
  if(!isObj(o)) return out;
  for(const k of Object.keys(f)){
    const v=o[k];
    if(v===undefined) continue;
    if(isObj(f[k])) { if(isObj(v)) out[k]=v; }
    else if(Array.isArray(f[k])) { if(Array.isArray(v)) out[k]=v; }
    else if(typeof f[k]==='number') { if(typeof v==='number'&&isFinite(v)) out[k]=v; }
    else out[k]=v;
  }
  out.set={...f.set,...(isObj(o.set)?o.set:{})};
  return out;
}

// Combine two progress states field by field, so syncing never throws away work done on either device.
function mergeState(a,b){
  a=sanitize(a); b=sanitize(b);
  const newer=(b.updated||0)>(a.updated||0)?b:a, older=newer===a?b:a;
  const maxMap=(x,y)=>{const o={...x}; for(const k in y) o[k]=Math.max(+o[k]||0,+y[k]||0); return o;};
  const m={...newer};
  m.xp=Math.max(a.xp,b.xp); m.bestStreak=Math.max(a.bestStreak,b.bestStreak); m.rushBest=Math.max(a.rushBest,b.rushBest);

  m.badges={...older.badges,...newer.badges}; m.flags={...older.flags,...newer.flags}; m.stars={...older.stars,...newer.stars};
  m.stats={...older.stats}; for(const k in newer.stats){ const x=m.stats[k], y=newer.stats[k]; m.stats[k]=!x||(y.last||0)>=(x.last||0)?y:x; }
  const seenT=new Set(); m.tests=[...a.tests,...b.tests].filter(t=>{const k=JSON.stringify(t); if(seenT.has(k)) return false; seenT.add(k); return true;}).slice(-50);
  m.lastTest=Math.max(a.lastTest||0,b.lastTest||0);

}

/* ---------- question builders ---------- */
function distract(item, pool, n, keyFn){
  const ans=keyFn(item), seen=new Set([ans]), out=[];
  const like=k=>ITEMS[k]&&ITEMS[k].kind===item.kind&&!!ITEMS[k].vowel===!!item.vowel;
  const sources=[pool.filter(like), Object.keys(ITEMS).filter(like)];
  for(const src of sources){ for(const id of shuffle(src)){ const it=ITEMS[id]; if(it===item) continue; const k=keyFn(it); if(seen.has(k)) continue; seen.add(k); out.push(it); if(out.length>=n) return out; } }
  return out;
}
function makeQ(item, type, pool){
  const glyphKey=it=>it.snd;
  if(item.kind==='glyph'){
    const sameKind=pool.filter(k=>ITEMS[k].kind==='glyph');
    if(type==='g2s'){ const d=distract(item,sameKind,3,glyphKey); return {type,item,title:'What sound does this make?',big:item.ch,opts:shuffle([item,...d]).map(it=>({label:it.snd,ok:it===item})),answer:item.snd}; }
    if(type==='s2g'||type==='hear'){ const d=distract(item,sameKind,3,glyphKey); return {type,item,title:type==='hear'?'Which one did you hear?':`Which one says "${item.snd}"?`,audio:type==='hear',opts:shuffle([item,...d]).map(it=>({he:it.ch,ok:it===item})),answer:item.ch}; }
    if(type==='name'){ const d=distract(item,sameKind,3,it=>it.nm); return {type,item,title:'What is it called?',big:item.ch,opts:shuffle([item,...d]).map(it=>({label:it.nm,ok:it===item})),answer:item.nm}; }
    if(type==='read'){ const d=distract(item,sameKind,3,it=>it.wt); return {type,item,title:'Read this word',mid:item.w,opts:shuffle([item,...d]).map(it=>({label:it.wt,ok:it===item})),answer:`${item.wt}, “${item.we}”`,sayText:item.w}; }
  }
  const sameKind=pool.filter(k=>ITEMS[k].kind==='phrase');
  if(type==='p2e'){ const d=distract(item,sameKind,3,it=>it.en); return {type,item,title:'What does this mean?',mid:heOf(item),tr:true,list:true,opts:shuffle([item,...d]).map(it=>({label:it.en,ok:it===item})),answer:item.en}; }
  if(type==='e2p'){ const d=distract(item,sameKind,3,it=>it.en); return {type,item,title:/\?$/.test(item.en)?`How do you ask “${item.en}”`:`How do you say “${item.en}”?`,list:true,opts:shuffle([item,...d]).map(it=>({he:heOf(it),ok:it===item})),answer:heOf(item)}; }
  if(type==='hearP'){ const d=distract(item,sameKind,3,it=>it.en); return {type,item,title:'What did you hear?',audio:true,list:true,opts:shuffle([item,...d]).map(it=>({label:it.en,ok:it===item})),answer:item.en}; }
  if(type==='build'){
    const words=heOf(item).split(' ').map(tileWord), keys=new Set(words.map(tileKey));
    const extra=[], ek=new Set();
    for(const w of distract(item,sameKind,4,it=>it.en).flatMap(it=>heOf(it).split(' ')).map(tileWord)){ const k=tileKey(w); if(!k||keys.has(k)||ek.has(k)) continue; ek.add(k); extra.push(w); }
    const bank=shuffle([...words,...pickN(extra,Math.min(3,Math.max(1,5-words.length)))]);
    return {type,item,title:`Build: “${item.en}”`,bank,target:words.map(tileKey).join(' '),answer:heOf(item)};
  }
  if(type==='speak') return {type,item,title:'Say it out loud',mid:heOf(item),tr:true,answer:heOf(item)};
  if(type==='sayEn') return {type,item,recall:true,title:'Say it in Hebrew',say:heOf(item),targets:[heOf(item)],answer:heOf(item)};
  if(type==='say') return item.kind==='glyph'
    ? {type,item,title:'Repeat after me',say:item.name,targets:[item.name,item.ch,item.w],answer:item.name}
    : {type,item,title:'Repeat after me',say:heOf(item),targets:[heOf(item)],answer:heOf(item)};
}
function typesFor(item, mode){
  if(item.kind==='glyph'){
    if(mode==='mix') return ['read','read','g2s','name'];
    return item.vowel?['g2s','s2g','read','name']:['g2s','s2g','hear','name','read','say'];
  }
  // Lines you'll hear from your partner are for understanding only, so you never practice saying them in their voice.
  if(item.partner) return ['p2e','hearP','hearP','p2e'];
  const n=heOf(item).split(' ').length;
  const t=['p2e','e2p','hearP','say'];
  if(n>=2&&n<=6) t.push('build','build');
  if((S.stats[item.id]||{}).c>=2) t.push('sayEn','sayEn');
  return t;
}
const SPEAK_TYPES=['say','sayEn','speak'];
const tileWord=w=>w.replace(/[?,!.]/g,'');
const tileKey=w=>strip(tileWord(w));
function buildQuestions(items, n, mode, pool){
  const qs=[]; let order=[];
  while(order.length<n) order=order.concat(shuffle(items));
  order=order.slice(0,n);
  const lastType={};
  for(const id of order){
    const it=ITEMS[id];
    let types=typesFor(it,mode).filter(t=>t!==lastType[id]&&(mode!=='test'||!SPEAK_TYPES.includes(t)));
    if(!types.length) types=typesFor(it,mode).filter(t=>mode!=='test'||!SPEAK_TYPES.includes(t));
    const t=types[Math.random()*types.length|0]; lastType[id]=t;
    qs.push(makeQ(it,t,pool));
  }
  return qs;
}

/* ---------- lesson engine ---------- */
let LS=null;
function startLesson(opt){
  if(opt.unit&&opt.unit.convo){ startConvo(opt.unit.convo,opt.unit); return; }
  let items, qs, intro=[], title, pool;
  if(opt.unit&&opt.unit.test){
    title=opt.unit.title; items=opt.unit.items; pool=items;
    qs=buildQuestions(pickN(items,15),15,'test',pool);
  } else if(opt.exam){
    title='Progress test'; items=seenItems(); pool=items;
    qs=buildQuestions(pickN(items,20),20,'test',pool);
  } else if(opt.unit){
    const u=opt.unit; title=u.title; items=u.items;
    pool=UNITS.filter(x=>x.track===u.track&&(S.lessons[x.id]||x===u)).flatMap(x=>x.items);
    if(!u.mix) intro=items.filter(id=>!S.stats[id]);
    if(u.mix) items=pickN(items.filter(id=>S.stats[id]).concat(items),14);
    qs=buildQuestions(items, u.mix?12:Math.max(10,Math.min(12,items.length+5)), u.mix?'mix':null, pool);
  } else if(opt.review){
    title='Smart review';
    const seen=seenItems();
    // Shakiest first; phrases never said out loud get a nudge up the list.
    const score=id=>{const s=S.stats[id];return (s.c||0)-2*(s.w||0)-(ITEMS[id].kind==='phrase'&&!ITEMS[id].partner&&!(S.spoken||{})[id]?1:0)+Math.random()*1.5;};
    items=seen.sort((a,b)=>score(a)-score(b)).slice(0,8); pool=seen;
    qs=buildQuestions(items,12,null,pool);
  } else {
    title=opt.title; pool=opt.pool; items=pickN(pool,10);
    qs=items.map(id=>makeQ(ITEMS[id],opt.drill,pool));
  }
  LS={opt,title,unit:opt.unit,test:!!(opt.exam||(opt.unit&&opt.unit.test)),qs,intro,introI:0,i:0,total:qs.length,correct:0,wrong:0,skipped:0,combo:0,best:0,xp:0,answeredAt:-1,missed:new Set()};
  $('#sheet').hidden=false;
  if(intro.length) renderIntro(); else renderQ();
}

function swipe(el,onNext,onPrev){

        : `<div class="prompt"><div class="glyph mid" lang="he">${esc(show(q.say))}</div>${S.set.tr?`<span class="tr">${esc(trOf(q.item))}</span>`:''}<span class="muted">${esc(q.item.en)}</span></div>`;

function answer(ok, selfRated, extra){
  if(!LS||LS.answeredAt===LS.i) return;   // one answer per question, however many times the mic is tapped
  LS.answeredAt=LS.i;
  const q=LS.qs[LS.i], id=q.item.id;
  // Practice drills can show items you haven't been taught yet; those don't count as learned.
  const st=S.stats[id]||(LS.opt.drill?null:(S.stats[id]={c:0,w:0}));
  const graded=extra&&extra.stars!=null;
  if(ok){ if(st) st.c++; LS.combo++; LS.best=Math.max(LS.best,LS.combo);
    const first=!LS.missed.has(q); let gain=first?10:5; if(graded) gain=[0,5,10,15][extra.stars]; if(LS.combo>0&&LS.combo%5===0) gain+=5;
    LS.xp+=gain; if(first) LS.correct++;
  } else { if(st) st.w++; LS.combo=0; LS.wrong++;
    if(!LS.missed.has(q)&&!selfRated){ LS.missed.add(q); if(!LS.test) LS.qs.push(q); }
    if(selfRated) LS.xp+=3;
  }
  if(st) st.last=Date.now();
  if(graded&&extra.stars>=2&&q.item.kind==='phrase'){ S.spoken=S.spoken||{}; S.spoken[id]=(S.spoken[id]||0)+1; }
  const fb=$('#fb'); fb.hidden=false;
  fb.className='feedback '+(ok?'good':'bad');

  const ansHtml = q.type==='read'?`${heSpan(q.item.w)} &nbsp;${esc(q.answer)}`
    : q.item.kind==='phrase'?`${heSpan(heOf(q.item))}<br>${S.set.tr?`<i>${esc(trOf(q.item))}</i> · `:''}${esc(q.item.en)}`
    : `${heSpan(q.item.ch)} ${esc(q.item.nm)}, “${esc(q.item.snd)}”`;
  const msg=graded?(extra.stars===3?'מְצֻיָּן! That came through clearly.':extra.stars===2?'Close! Most of it came through.':'Not quite. Listen once more and try again.')
    :ok?(selfRated?'Great. Keep using it.':praise[Math.random()*praise.length|0]):(selfRated?'You\'ll see it again soon.':'Not quite.');
  fb.innerHTML=`<div class="msg">${msg}</div>
    ${(!ok||showAns)&&(!isSpeak||q.recall)?`<div class="ans">${ok?'':'Answer: '}${ansHtml}</div>`:''}
    ${graded?`<div class="row"><button class="btn ghost" id="again">${ICON.mic} Try again</button><button class="btn" id="cont">Continue</button></div>`:`<button class="btn" id="cont">Continue</button>`}`;
  if(graded) $('#again').onclick=()=>{ const m=$('#mic'); if(m) m.click(); };
  if(isSpeak){ if(q.recall&&!graded) say(q.say); }
  else if(q.type==='speak'){ if(ok) say(heOf(q.item)); }
  else if(q.item.kind==='phrase') say(heOf(q.item));
  else if(q.type==='read') say(q.item.w);
  else say(q.item.name);
  $('#cont').onclick=nextQ;
  $('#cont').focus();
  const c=document.querySelector('.combo'); if(c) c.textContent=LS.combo>=3?'×'+LS.combo:'';

function addXP(n){

}

  $('#sheetIn').innerHTML=`<div class="qbody"><div class="done-hero">
      <span class="he" lang="he">${perfect?'מוּשְׁלָם!':acc>=70?'כׇּל הַכָּבוֹד!':'יוֹפִי!'}</span>
      <h2>${perfect?'Perfect!':acc>=70?'Well done!':'Nice work!'}</h2>

  let k=0; const step=()=>{k=Math.min(xp,k+Math.ceil(xp/30));const e=$('#xpCount'); if(e){e.textContent='+'+k; if(k<xp) requestAnimationFrame(step);}}; step();

/* ---------- letter rush ---------- */
let RUSH=null;
function startRush(){
  const learned=Object.keys(GLYPHS).map(k=>'L:'+k).filter(id=>S.stats[id]&&!ITEMS[id].vowel);
  const pool=learned.length>=6?learned:UNITS[0].items.concat(UNITS[1].items);
  LS={title:'Letter Rush',combo:0,qs:[],i:0,opt:{}};
  RUSH={pool,score:0,left:60,timer:null,miss:0};
  $('#sheet').hidden=false;
  rushQ();
  RUSH.timer=setInterval(()=>{ if(!RUSH) return; RUSH.left--; const t=$('#rushT'); if(t) t.textContent=RUSH.left+'s'; if(RUSH.left<=0) endRush(); },1000);
}
function rushQ(){

   <div class="qbody"><div class="glyph" lang="he">${esc(it.ch)}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o.label)}</button>`).join('')}</div>
   <p class="muted" style="text-align:center;margin:0">Wrong answers cost 3 seconds.</p></div>`;
  bindQuit();

    if(b.disabled) return;
    const o=q.opts[+b.dataset.o]; const st=S.stats[it.id]||{c:0,w:0};   // only letters you've learned are tracked
    if(o.ok){ RUSH.score++; st.c++; b.classList.add('right'); }
    else { RUSH.left=Math.max(0,RUSH.left-3); RUSH.miss++; st.w++; b.classList.add('wrong'); document.querySelectorAll('.opt').forEach((x,i)=>{ if(q.opts[i].ok) x.classList.add('right'); }); }
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    setTimeout(()=>{ if(RUSH&&RUSH.left>0) rushQ(); else if(RUSH) endRush(); }, o.ok?220:700);
  });
}
function endRush(){
  clearInterval(RUSH.timer);

/* ---------- speaking: speech recognition, record-and-compare, self-rating ---------- */
/* iPhone home-screen apps can't use speech recognition at all (WebKit bug 225298), so there we go straight to
   record-and-compare. In Safari it works when Siri is on. Everything is keyed to QTOK, the question on screen,
   so a late result or a stray timer can never touch the next question. */
const SRec=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const iosStandalone=isIOS&&(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches);
const asrSession={off:false,misses:0};
let QTOK=null, autoSayT=null, REC=null;
function speakMode(){
  if(SRec()&&!iosStandalone&&S.set.asr!=='off'&&!asrSession.off) return 'asr';
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder) return 'rec';
  return 'self';
}
function stopListening(){ if(REC){ const r=REC; REC=null; r.abort(); } }

/* Text comparison. Recognizers write plain spelling (סוכר, איתך, עייפה) while the app has vowel marks (סֻכָּר, אִתָּךְ),
   so both sides are folded the same way: same-sounding letters merged, vowel letters and doubles dropped. */
const LATIN={ross:'רוס'};
const FINALS={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function normWord(w){
  return strip(String(w).toLowerCase().replace(/[a-z]+/g,m=>LATIN[m]||'')).replace(/[^א-ת]/g,'')
    .replace(/[ךםןףץ]/g,c=>FINALS[c]).replace(/[חק]/g,'כ').replace(/ט/g,'ת').replace(/ע/g,'א')
    .replace(/(.)\1+/g,'$1').replace(/(?!^)[וי]/g,'').replace(/ב/g,'ו').replace(/ה$/,'א');
}
const normHe=t=>String(t).split(/\s+/).map(normWord).join('');
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function grade(alts,targets){
  let best=0,text=alts[0]||'',target=targets[0];
  for(const a of alts){ const na=normHe(a); if(!na) continue;
    for(const t of targets){ const nt=normHe(t); if(!nt) continue;
      const sc=sim(na,nt); if(sc>best){best=sc;text=a;target=t;} } }
  return {score:best,text,target};
}
const starsOf=score=>score>=.8?3:score>=.6?2:score>=.35?1:0;
// Which words of the target came through, so you know exactly what to work on.
function wordMatch(alts,target){
  const heard=alts.flatMap(a=>String(a).split(/\s+/)).map(normWord).filter(Boolean);
  return target.split(/\s+/).map(w=>tileWord(w)).filter(Boolean).map(w=>{ const n=normWord(w);
    return {w, ok:!n||heard.some(h=>sim(h,n)>=.67)}; });
}
const SOUND_TIPS=[
  [/[חך]|כ(?!ּ)/,'ח, and כ without a dot, are a throaty "ch", like in Bach.'],
  [/ר/,'Hebrew ר comes from the back of the throat, close to a French r. Don\'t use the English r.'],
  [/צ/,'צ is "ts", like the end of "cats".'],
];
function tipsFor(chips){
  const miss=chips.filter(c=>!c.ok).map(c=>c.w).join(' '); if(!miss) return [];
  const t=SOUND_TIPS.filter(([re])=>re.test(miss)).map(x=>x[1]).slice(0,2);
  if(t.length<2) t.push('Most Hebrew words are stressed on the last syllable. Say it a little slower and clearer.');
  return t;
}
function starsHtml(n){ return `<div class="stars">${[0,1,2].map(i=>`<span class="${i<n?'on':''}">${ICON.star}</span>`).join('')}</div>`; }

/* One recognition attempt. Second tap = "I'm done". Results that arrive after stop() are still used (iPhone sends them late). */
function listenOnce(tok,h){
  const SR=SRec(); let r;
  try{ r=new SR(); }catch(e){ h.onFail('start-failed'); return; }
  r.lang='he-IL'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  let alts=[], done=false, stopping=false, lastErr='', silenceT=null, graceT=null, hardT=null;
  const clear=()=>[silenceT,graceT,hardT].forEach(clearTimeout);
  const me={tok};
  const finish=()=>{ if(done) return; done=true; clear(); if(REC===me) REC=null; h.onEnd(); if(QTOK!==tok) return; alts.length?h.onDone(alts):h.onFail(lastErr); };
  me.stop=()=>{ if(stopping||done) return; stopping=true; try{ r.stop(); }catch(e){} clearTimeout(graceT); graceT=setTimeout(finish,5000); if(!alts.length) h.onChecking(); };
  me.abort=()=>{ if(done) return; done=true; clear(); try{ r.abort(); }catch(e){} if(REC===me) REC=null; h.onEnd(); };
  r.onresult=e=>{
    if(done) return;
    let joined='', isFinal=false; const extra=[];
    for(let i=0;i<e.results.length;i++){ const res=e.results[i]; joined+=res[0].transcript; if(res.isFinal) isFinal=true; for(let k=1;k<res.length;k++) extra.push(res[k].transcript); }
    alts=[joined,...extra].filter(t=>t&&t.trim());
    if(joined.trim()&&QTOK===tok) h.onInterim(joined);
    clearTimeout(silenceT);
    if(isFinal) silenceT=setTimeout(finish,250); else if(!stopping) silenceT=setTimeout(me.stop,1500);
  };
  r.onerror=e=>{ lastErr=e.error||'error'; if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ alts=[]; finish(); } };
  r.onend=()=>{ if(done) return; clearTimeout(graceT); graceT=setTimeout(finish,alts.length?50:600); };
  try{ r.start(); }catch(e){ h.onFail('start-failed'); return; }
  REC=me; hardT=setTimeout(me.stop,8000); h.onStart();
}

/* Wire up the mic area (#micwrap/#mic/#heard) and the rating area (#fb) for one speaking prompt.
   h: {targets, onGraded(res,first), onSelf(ok), native(), afterRecord(), fallback()} */
function setupSpeak(q,h){
  const mode=speakMode();
  if(mode!=='asr'){ (h.fallback||(()=>mode==='rec'?recorderUI(q,h):selfRateUI(q,h)))(); return; }
  let graded=false;
  const tok=QTOK;
  $('#mic').onclick=()=>{
    if(REC&&REC.tok===tok){ REC.stop(); return; }
    stopListening(); clearTimeout(autoSayT); try{ window.speechSynthesis?.cancel?.(); }catch(e){}
    const hEl=$('#heard'), mic=$('#mic');
    const put=html=>{ if(hEl&&hEl.isConnected) hEl.innerHTML=html; };
    listenOnce(tok,{
      onStart:()=>{ mic.classList.add('on'); put('Listening… say it, then tap the mic when you\'re done.'); },
      onInterim:t=>put(`<div>${heSpan(t)}</div><small>Tap the mic when you're done.</small>`),
      onChecking:()=>put('Checking…'),
      onEnd:()=>mic.classList.remove('on'),
      onDone:alts=>{
        asrSession.misses=0;
        const res=grade(alts,h.targets); res.stars=starsOf(res.score);
        const chips=wordMatch(alts,res.target);
        put(`${starsHtml(res.stars)}<div class="chips" lang="he">${chips.map(c=>`<span class="wchip ${c.ok?'ok':'miss'}">${esc(show(c.w))}</span>`).join('')}</div>
          <div class="muted" style="font-size:13px">Green words came through. I heard: ${heSpan(res.text)}</div>
          ${res.stars<3?tipsFor(chips).map(t=>`<div class="tip">${t}</div>`).join(''):''}`);
        const first=!graded; graded=true; h.onGraded(res,first);
      },
      onFail:err=>{
        asrSession.misses++;
        const fatal=['not-allowed','service-not-allowed','audio-capture','start-failed'].includes(err);
        if(fatal||asrSession.misses>=3){
          asrSession.off=true;
          toast(err==='service-not-allowed'?'Speech scoring is off on this phone (on iPhone, Siri must be on). Switching to record and compare.'
            :err==='not-allowed'?'The microphone is blocked for this page. Switching to record and compare.'
            :'Scoring isn\'t hearing you here, so let\'s record and compare instead.');
          if(!graded) (h.fallback||(()=>recorderUI(q,h)))(); else put('Scoring stopped working. Tap Continue.');
          return;
        }
        put(`I didn't catch that. Tap the mic and try again.${err&&err!=='error'?`<br><small class="muted">(${esc(err)})</small>`:''}`);
      }
    });
  };
}
function rateRow(h){
  const fb=$('#fb'); if(!fb) return;
  fb.hidden=false; fb.className='feedback';
  fb.innerHTML=`<div class="row"><button class="btn ghost" id="sp0">Still tricky</button><button class="btn sea" id="sp1">I nailed it</button></div>`;
  $('#sp1').onclick=()=>{ stopAllAudio(); stopRecStream(); h.onSelf(true); };
  $('#sp0').onclick=()=>{ stopAllAudio(); stopRecStream(); h.onSelf(false); };
}
function selfRateUI(q,h){
  const w=$('#micwrap'); if(!w) return;
  w.innerHTML=`<div class="tip">Recording isn't available here, so be your own judge: say it out loud, ${q.recall?'then tap Show a hint to check.':'play the audio, and compare.'}</div>`;
  rateRow(h);
}
/* Record yourself, then hear yourself next to the native audio and rate yourself. Works in the iPhone home-screen app. */
let recStream=null, recMedia=null, recURL=null;
function stopRecStream(){ try{ recStream&&recStream.getTracks().forEach(t=>t.stop()); }catch(e){} recStream=null; }
function stopRecording(){ try{ if(recMedia&&recMedia.state==='recording') recMedia.stop(); }catch(e){} }
function recorderUI(q,h){
  const w=$('#micwrap'); if(!w) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ selfRateUI(q,h); return; }
  const tok=QTOK;
  w.innerHTML=`<button class="mic" id="recBtn" aria-label="Record yourself">${ICON.mic}</button>
    <div class="heard muted" id="heard">Tap to record yourself, then tap again to stop.</div>
    <div class="row" id="cmp" hidden style="width:100%"><button class="btn ghost" id="playMine">${ICON.play} Me</button><button class="btn sea" id="playNative">${ICON.play} Native</button></div>
    ${iosStandalone?'<small class="muted">Scoring isn\'t available in the home-screen app on iPhone. For scored practice, open Daber in Safari.</small>':''}`;
  rateRow(h);
  $('#playNative').onclick=()=>h.native();
  $('#playMine').onclick=()=>{ if(recURL){ try{ window.speechSynthesis?.cancel?.(); }catch(e){} const a=new Audio(recURL); a.play().catch(()=>{}); } };
  let busy=false;
  $('#recBtn').onclick=async()=>{
    const btn=$('#recBtn'), hd=$('#heard');
    if(recMedia&&recMedia.state==='recording'){ recMedia.stop(); return; }
    if(busy) return; busy=true;
    stopListening(); clearTimeout(autoSayT); try{ window.speechSynthesis?.cancel?.(); }catch(e){}
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ busy=false; if(QTOK===tok) selfRateUI(q,h); return; }
    busy=false;
    if(QTOK!==tok){ stream.getTracks().forEach(t=>t.stop()); return; }
    stopRecStream(); recStream=stream;
    const chunks=[], mr=new MediaRecorder(stream); recMedia=mr;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{
      clearTimeout(mr._t); if(recStream===stream) stopRecStream(); else stream.getTracks().forEach(t=>t.stop());
      btn.classList.remove('on');
      if(QTOK!==tok) return;
      if(recURL) URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/mp4'}));
      if(h.afterRecord) h.afterRecord();
      hd.textContent='Compare your version with the native one, then rate yourself.';
      $('#cmp').hidden=false;
      const a=new Audio(recURL); a.onended=()=>setTimeout(()=>{ if(QTOK===tok) h.native(); },300); a.play().catch(()=>h.native());
    };
    mr.start(); btn.classList.add('on'); hd.textContent='Recording… tap again to stop.';
    mr._t=setTimeout(()=>{ if(mr.state==='recording') mr.stop(); },8000);
  };
}

/* ---------- conversations ---------- */
let CV=null;
const HER={partner:true};   // her lines use the partner forms: her gender speaking, yours listening
function herLine(ref){
  if(typeof ref==='string'){ const it=ITEMS['P:'+ref]; return {he:pickV(it.heV,HER),tr:pickV(it.trV,HER),en:it.en}; }
  const [he,tr,en]=ref; return {he:pickV(he,HER),tr:pickV(tr,HER),en};
}
const sayHer=t=>say(t,false,1.15);
const partnerWord=(she,he)=>S.set.them==='m'?he:she;
function openConvos(){
  stopAllAudio(); FC=null; LS=null; CV=null; $('#sheet').hidden=false;
  $('#sheetIn').innerHTML=`<div class="lbar"><button class="x" id="fcClose" aria-label="Close">${ICON.x}</button><div class="qtitle" style="flex:1">Conversations</div></div>
    <div class="qbody"><p class="muted" style="margin:0">${partnerWord('She','He')} says a line, then it's your turn to answer out loud. You'll see what to say in English, with a hint if you need it.</p>
    <div class="stack">${Object.entries(DIALOGS).map(([id,d])=>`<button class="card practice-item" data-dl="${id}"><span class="ic he sm" lang="he">שִׂיחָה</span><div><b>${esc(d.title)}${(S.convos||{})[id]?' ✓':''}</b><span>${esc(d.ctx)} ${d.turns.length} lines.</span></div></button>`).join('')}</div></div>`;
  $('#fcClose').onclick=closeSheet;
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>startConvo(b.dataset.dl,null));
}
function startConvo(id,unit){
  stopAllAudio();
  CV={id,d:DIALOGS[id],unit,i:0,log:[],xp:0,stars:[],doneTurn:-1};
  LS={title:CV.d.title,qs:[],i:0,combo:0,opt:{convo:true},answeredAt:-1};
  $('#sheet').hidden=false;
  $('#sheetIn').innerHTML=lessonBar(0)+`<div class="qbody"><div class="eyebrow">Conversation</div><h2>${esc(CV.d.title)}</h2>
    <p class="muted" style="margin:0">${esc(CV.d.ctx)}</p>
    <div class="tip">${partnerWord('She','He')} speaks first. Tap “What does ${partnerWord('she','he')} mean?” if you need the English. On your turn, answer out loud in Hebrew.${speakMode()==='asr'?'':' Then pick the answer you said, to check yourself.'}</div></div>
    <div class="feedback"><button class="btn" id="cont">Start</button></div>`;
  bindQuit();
  $('#cont').onclick=renderTurn;
}
function convoLog(){ return CV.log.map(l=>`<div class="bub ${l.me?'me':'her'}">${heSpan(l.he)}${l.me?`<span class="bstars">${'★'.repeat(l.stars)}${'☆'.repeat(3-l.stars)}</span>`:''}</div>`).join(''); }
function scrollChat(){ const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight; }
function renderTurn(){
  stopAllAudio();
  const t=CV.d.turns[CV.i]; if(!t){ finishConvo(); return; }
  QTOK={convo:CV.i};
  const el=$('#sheetIn'), prog=CV.i/CV.d.turns.length;
  if(t.her){
    const L=herLine(t.her), last=!CV.d.turns[CV.i+1];
    el.innerHTML=lessonBar(prog)+`<div class="qbody chat" id="chat">${convoLog()}
      <div class="bub her now">${heSpan(L.he)}${S.set.tr?`<span class="tr">${esc(L.tr)}</span>`:''}<button class="linkbtn" id="enB">What does ${partnerWord('she','he')} mean?</button></div>${playRow()}</div>
      <div class="feedback" id="fb"><button class="btn" id="cont">${last?'Finish':'Your turn'}</button></div>`;
    bindQuit();
    $('#qplay').onclick=()=>sayHer(L.he); $('#qslow').onclick=()=>say(L.he,true,1.15);
    $('#enB').onclick=e=>{ e.currentTarget.outerHTML=`<span class="en">${esc(L.en)}</span>`; };
    autoSayT=setTimeout(()=>sayHer(L.he),300);
    $('#cont').onclick=()=>{ CV.log.push({he:L.he}); CV.i++; renderTurn(); };
    scrollChat(); return;
  }
  const ids=t.me.map(k=>'P:'+k), items=ids.map(k=>ITEMS[k]), targets=items.map(heOf);
  const q={item:items[0],say:targets[0],targets,recall:true,hinted:false};
  el.innerHTML=lessonBar(prog)+`<div class="qbody chat" id="chat">${convoLog()}
    <div class="bub me ask"><span class="eyebrow">Your turn</span><b>Say: “${esc(items[0].en)}”</b>${items.length>1?`<span class="muted" style="font-size:13px">or: ${items.slice(1).map(it=>'“'+esc(it.en)+'”').join(', ')}</span>`:''}
      <div id="reveal" class="prompt" style="margin-top:6px"><button class="btn ghost" id="hintB" style="width:auto;padding:8px 14px">Show a hint</button></div></div>
    <div class="micwrap" id="micwrap"><button class="mic" id="mic" aria-label="Answer out loud">${ICON.mic}</button><div class="heard muted" id="heard">Tap the mic and answer.</div></div></div>
    <div class="feedback" id="fb"><button class="btn ghost" id="showMe">Show me the answer</button></div>`;
  bindQuit();
  $('#hintB').onclick=()=>{ q.hinted=true; revealQ(q,true); scrollChat(); };
  const showMe=()=>{ revealQ(q,false); meDone(items[0],0,false); };
  $('#showMe').onclick=showMe;
  setupSpeak(q,{targets,
    onGraded:res=>{
      const stars=q.hinted?Math.min(2,res.stars):res.stars, it=items[Math.max(0,targets.indexOf(res.target))];
      if(stars>=2){ meDone(it,stars,true); return; }
      const fb=$('#fb'); fb.className='feedback bad';
      fb.innerHTML=`<div class="msg">Not quite. Try again, or see the answer.</div><div class="row"><button class="btn ghost" id="showMe">Show me</button><button class="btn" id="again">${ICON.mic} Try again</button></div>`;
      $('#showMe').onclick=showMe; $('#again').onclick=()=>$('#mic')&&$('#mic').click();
    },
    onSelf:ok=>meDone(items[0],ok?2:0,false),
    native:()=>say(targets[0]),
    fallback:()=>pickUI(q,items),
  });
  scrollChat();
}
// No speech scoring: say it out loud, then pick the line you said.
function pickUI(q,items){
  const w=$('#micwrap'); if(!w) return;
  const mine=new Set(items.map(it=>it.id)), ens=new Set(items.map(it=>it.en));
  const others=[...new Set(Object.values(DIALOGS).flatMap(d=>d.turns.filter(t=>t.me).map(t=>'P:'+t.me[0])))].filter(k=>!mine.has(k)&&!ens.has(ITEMS[k].en));
  const opts=shuffle([{it:items[0],ok:true},...pickN(others,2).map(k=>({it:ITEMS[k],ok:false}))]);
  w.innerHTML=`<div class="muted" style="text-align:center">Say your answer out loud first. Then tap the one you said.</div>
    <div class="opts list" style="width:100%">${opts.map((o,i)=>`<button class="opt" data-pk="${i}">${heSpan(heOf(o.it))}</button>`).join('')}</div>`;
  w.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.pk];
    w.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled=true; if(opts[i].ok) x.classList.add('right'); });
    if(!o.ok) b.classList.add('wrong');
    revealQ(q,false);
    meDone(items[0],o.ok?(q.hinted?1:2):0,false);
  });
  scrollChat();
}
function meDone(item,stars,asr){
  if(!CV||CV.doneTurn===CV.i) return; CV.doneTurn=CV.i;
  stopListening();
  const id=item.id, he=heOf(item), st=S.stats[id]=S.stats[id]||{c:0,w:0};
  stars>=1?st.c++:st.w++; st.last=Date.now();
  if(asr&&stars>=2){ S.spoken=S.spoken||{}; S.spoken[id]=(S.spoken[id]||0)+1; }
  CV.xp+=[0,5,10,15][stars]; CV.stars.push(stars);
  const fb=$('#fb'); fb.hidden=false; fb.className='feedback '+(stars>=2?'good':'bad');
  fb.innerHTML=`<div class="msg">${stars===3?'מְצֻיָּן! Perfect reply.':stars===2?'יָפֶה! Good reply.':stars===1?'Almost.':'Here\'s how to say it.'}</div>
    <div class="ans">${heSpan(he)}<br>${S.set.tr?`<i>${esc(trOf(item))}</i> · `:''}${esc(item.en)}</div>
    <button class="btn" id="cont">Continue</button>`;
  say(he);
  $('#cont').onclick=()=>{ CV.log.push({me:true,he,stars}); CV.i++; renderTurn(); };
  $('#cont').focus();
  scrollChat();
}
function finishConvo(){
  const c=CV; stopAllAudio(); QTOK=null;
  if(c.unit) S.lessons[c.unit.id]=(S.lessons[c.unit.id]||0)+1;
  S.convos=S.convos||{}; S.convos[c.id]=(S.convos[c.id]||0)+1; S.flags.convo=true;
  const xp=c.xp+15; addXP(xp); const nb=checkBadges(); save();
  const good=c.stars.filter(s=>s>=2).length;
  $('#sheetIn').innerHTML=`<div class="qbody"><div class="done-hero">
      <span class="he" lang="he">כׇּל הַכָּבוֹד!</span>
      <h2>Conversation done</h2>
      <p class="muted" style="margin:0">${esc(c.d.title)}</p>
      <div class="rewards">
        <div class="reward xp"><b>+${xp}</b><span>XP</span></div>
        <div class="reward acc"><b>${good}/${c.stars.length}</b><span>Good replies</span></div>
        <div class="reward fire"><b>${S.streak}</b><span>Day streak</span></div>
      </div>
      ${nb.map(b=>`<div class="tip" style="width:100%"><b>New badge: ${b.t}.</b> ${b.d}.</div>`).join('')}
      <div class="chat" style="width:100%;display:flex;flex-direction:column;gap:8px">${convoLog()}</div>
      <div class="tip" style="width:100%"><b>Now for real:</b> try this exchange with ${partnerWord('her','him')} tonight.</div>
    </div></div>
    <div class="feedback"><div class="row"><button class="btn ghost" id="again">Again</button><button class="btn" id="doneBtn">Continue</button></div></div>`;
  confetti();
  $('#again').onclick=()=>startConvo(c.id,c.unit);
  $('#doneBtn').onclick=()=>{ LS=null; CV=null; $('#sheet').hidden=true; render(); };
}

/* ---------- flashcards ---------- */
let FC=null;
function decks(){
  const g=Object.keys(GLYPHS);
  const d=[
    {id:'letters',title:'Letters',ids:g.filter(k=>!GLYPHS[k].vowel&&!k.endsWith('_s')).map(k=>'L:'+k)},
    {id:'finals',title:'Final forms',ids:g.filter(k=>k.endsWith('_s')).map(k=>'L:'+k)},
    {id:'vowels',title:'Vowel marks',ids:g.filter(k=>GLYPHS[k].vowel).map(k=>'L:'+k)},
    ...Object.keys(PHRASES).map(cat=>({id:cat,title:CAT_TITLE[cat],ids:P(cat)})),
  ];
  const st=Object.keys(S.stars||{}).filter(k=>ITEMS[k]);
  if(st.length) d.unshift({id:'starred',title:'Starred phrases',ids:st});
  return d;
}
function closeSheet(){ stopAllAudio(); QTOK=null; LS=null; FC=null; CV=null; $('#sheet').hidden=true; render(); }
function openDecks(){
  FC=null; LS=null; $('#sheet').hidden=false;
  const list=decks();
  $('#sheetIn').innerHTML=`<div class="lbar"><button class="x" id="fcClose" aria-label="Close">${ICON.x}</button><div class="qtitle" style="flex:1">Flashcards</div></div>
    <div class="qbody"><p class="muted" style="margin:0">Pick a deck. Tap a card to flip it, and use Back and Next (or swipe) to move through.</p>
    <div class="stack">${list.map(d=>`<button class="card practice-item" data-deck="${d.id}"><span class="ic he ${d.id==='letters'||d.id==='finals'||d.id==='vowels'?'':'sm'}" lang="he">${esc(show(heOf(ITEMS[d.ids[0]])))}</span><div><b>${esc(d.title)}</b><span>${d.ids.length} cards</span></div></button>`).join('')}</div></div>`;
  $('#fcClose').onclick=closeSheet;
  document.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{ const d=list.find(x=>x.id===b.dataset.deck); FC={d,ids:d.ids.slice(),i:0,flip:false}; renderCard(); });
}
function renderCard(){
  const it=ITEMS[FC.ids[FC.i]], g=it.kind==='glyph', he=heOf(it), last=FC.i===FC.ids.length-1;
  const back=g?`<div class="name">${esc(it.nm)} ${heSpan(it.name)}</div><span class="snd">sounds like: ${esc(it.snd)}</span><div>${heSpan(it.w)} <span class="muted">${esc(it.wt)}, “${esc(it.we)}”</span></div>`
    :`${S.set.tr?`<span class="tr" style="font-size:20px">${esc(trOf(it))}</span>`:''}<b style="font-size:20px">${esc(it.en)}</b>`;
  $('#sheetIn').innerHTML=`<div class="lbar"><button class="x" id="fcBack" aria-label="Back to decks">${ICON.left}</button><div class="bar"><i style="width:${(FC.i+1)/FC.ids.length*100}%"></i></div><div class="combo" style="color:var(--muted)">${FC.i+1}/${FC.ids.length}</div></div>
    <div class="qbody">
      <button class="fc ${FC.flip?'flipped':''}" id="fcCard" aria-label="Flip card">
        <div class="glyph ${g?'':'mid'}" lang="he">${esc(show(he))}</div>
        ${FC.flip?back:'<span class="muted">Tap to flip</span>'}
      </button>
      <div class="playrow"><button class="iconbtn" id="fcPlay" aria-label="Play">${ICON.play}</button><button class="iconbtn" id="fcSlow" aria-label="Play slowly">${ICON.slow}</button><button class="iconbtn" id="fcShuffle" aria-label="Shuffle deck">${ICON.shuffle}</button></div>
    </div>
    <div class="feedback"><div class="row"><button class="btn ghost" id="fcPrev" ${FC.i?'':'disabled'}>${ICON.left} Back</button><button class="btn" id="fcNext">${last?'Done':'Next'} ${last?'':ICON.right}</button></div></div>`;
  const text=g?it.name:he;
  $('#fcBack').onclick=openDecks;
  $('#fcCard').onclick=()=>{ FC.flip=!FC.flip; renderCard(); if(FC.flip) say(text); };
  $('#fcPlay').onclick=()=>say(text); $('#fcSlow').onclick=()=>say(text,true);
  $('#fcShuffle').onclick=()=>{ FC.ids=shuffle(FC.ids); FC.i=0; FC.flip=false; renderCard(); toast('Shuffled'); };
  $('#fcPrev').onclick=()=>{ if(FC.i>0){ FC.i--; FC.flip=false; renderCard(); } };
  $('#fcNext').onclick=()=>{ if(last){ openDecks(); return; } FC.i++; FC.flip=false; renderCard(); };
  swipe($('.qbody'),()=>{ if(!last) $('#fcNext').click(); },()=>$('#fcPrev').click());
}
document.addEventListener('keydown',e=>{
  if($('#sheet').hidden) return;
  const k=e.key; const tgt=k==='ArrowRight'?['#fcNext','#next','#cont']:k==='ArrowLeft'?['#fcPrev','#prev']:null;
  if(!tgt) return; for(const s of tgt){ const b=$(s); if(b&&!b.disabled){ b.click(); e.preventDefault(); return; } }
});

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'); c.hidden=false; const x=c.getContext('2d');
  const W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--sea','--gold','--good'].map(v=>cs.getPropertyValue(v).trim());
  const ps=[...Array(90)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.02,vy:-Math.random()*H*.02-H*.006,r:Math.random()*6+4,c:cols[Math.random()*4|0],a:Math.random()*6}));
  let t=0; (function f(){ x.clearRect(0,0,W,H); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0006;p.a+=.15;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio/2,p.r*devicePixelRatio/2);x.restore();}); if(++t<110) requestAnimationFrame(f); else {x.clearRect(0,0,W,H);c.hidden=true;} })();
}

render();
initCloud();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
